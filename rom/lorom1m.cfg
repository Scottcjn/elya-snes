# ld65 config for the 1 MiB LoROM cartridge that carries FIVE topic shards.
#
# cc65 2.18 ships no SNES config, so this is ours, and it is rom/lorom256.cfg
# grown from one model to five.  FINDINGS entry 11 measured five narrow models
# beating one general one by 23.9 points of held-out paraphrase and priced the
# cartridge at 0.63 MiB of straight-line 65816 against a 4 MB LoROM ceiling;
# this is the map that spends it.
#
# File layout (LoROM: bank N shows 32 KiB at $N0:8000-$N0:FFFF):
#   $000000-$007FBF   bank $00        driver, handlers, tables, router table
#   $007FC0-$007FDF   bank $00        cartridge header
#   $007FE0-$007FFF   bank $00        vectors
#   $008000-$0A7FFF   banks $01-$14   WEIGHTS: five weight programs, four banks
#                                     each, shard s at bank $01 + 4s
#   $0A8000-$0CFFFF   banks $15-$19   MDATA:   shard s's embedding and
#                                     positional table, one bank each
#   $0D0000-$0D7FFF   bank  $1A       PTABSEG: the exact softmax normaliser's
#                                     division table
#   $0D8000-$0DFFFF   bank  $1B       GAMEDATA: art, menu, router table, and
#                                     the 345 questions the route survey runs
#   $0E0000-$0FFFFF   banks $1C-$1F   padding to a power of two
#
# WHY THE EMBEDDING GETS A BANK PER SHARD RATHER THAN SHARING ONE.  Each shard
# is a whole model, so each has its own 64x64 embedding (8,192 bytes) and its
# own 20x64 positional table (2,560).  Three would fit in one bank and five
# would not, so the choice was one bank each (160 KiB, 89% of it padding) or
# an uneven two-bank packing with a lookup.  ROM is the one resource this
# cartridge has to spare -- 1 MiB of a 4 MB ceiling on a 6.91 MB cart -- and
# `MDBANK + s` is three instructions where the packing is a table.  The waste
# is deliberate and it is cheaper than the code.
#
# Nothing inside WEIGHTS, MDATA or PTAB is referenced by symbol: tools/emit.py
# placed every byte and rom/nn.s reaches them through constants in model.inc.
# Their memory-area `start` is therefore decorative, and deliberately so -- the
# blobs span banks, which no single ld65 address can describe.
#
# GAMEDATA is different: it IS referenced by symbol, so it gets a memory area
# of exactly one bank.  ld65 has no concept of a LoROM bank, so its labels come
# out as plain $8000-$FFFF addresses and rom/game.inc supplies the bank as the
# constant GDBASE, which tools/emit.py now writes into model.inc rather than
# leaving hard-coded in two places.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0700, size = $0100, type = rw;

    ROM0:     start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HEADER:   start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    WBANKS:   start = $8000, size = $A0000, type = ro, file = %O, fill = yes, fillval = $00;
    MDBANKS:  start = $8000, size = $28000, type = ro, file = %O, fill = yes, fillval = $00;
    PBANK:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    GBANK:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    PADBANK:  start = $8000, size = $20000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:     load = ROM0,    type = ro, start = $8000;
    RODATA:   load = ROM0,    type = ro, align = $100, optional = yes;
    SNESHDR:  load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
    ZP:       load = ZEROPAGE, type = zp, optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes;
    WEIGHTS:  load = WBANKS,  type = ro;
    MDATA:    load = MDBANKS, type = ro;
    PTABSEG:  load = PBANK,   type = ro;
    GAMEDATA: load = GBANK,   type = ro, optional = yes;
}
