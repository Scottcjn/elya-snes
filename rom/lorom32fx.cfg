# Like lorom32.cfg, but with three fixed 512-byte windows for GSU kernels.
# GSU code contains absolute addresses (the LOOP target in R13), so a kernel
# has to be linked at exactly the address asar assembled it for.  Getting this
# wrong is silent: the GSU runs, the loop target is garbage, and the kernel
# falls straight through to STOP having done almost no work.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0100, size = $0200, type = rw;
    WRAMCODE: start = $0300, size = $0500, type = rw, define = yes;
    RAM2:     start = $0800, size = $1700, type = rw;
    STACK:    start = $1F00, size = $0100, type = rw;

    ROM:      start = $8000, size = $1000, type = ro, file = %O, fill = yes, fillval = $00;
    GSU0:     start = $9000, size = $0200, type = ro, file = %O, fill = yes, fillval = $00;
    GSU1:     start = $9200, size = $0200, type = ro, file = %O, fill = yes, fillval = $00;
    GSU2:     start = $9400, size = $0200, type = ro, file = %O, fill = yes, fillval = $00;
    GSU3:     start = $9600, size = $0200, type = ro, file = %O, fill = yes, fillval = $00;
    ROM2:     start = $9800, size = $67C0, type = ro, file = %O, fill = yes, fillval = $00;
    HEADER:   start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:     load = ROM,     type = ro,  start = $8000;
    GSUEMPTY: load = GSU0,    type = ro,  start = $9000;
    GSUINT8:  load = GSU1,    type = ro,  start = $9200;
    GSUTERN:  load = GSU2,    type = ro,  start = $9400;
    GSUNOMUL: load = GSU3,    type = ro,  start = $9600;
    RODATA:   load = ROM2,    type = ro,  align = $100, optional = yes;
    SNESHDR:  load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
    ZP:       load = ZEROPAGE, type = zp, optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes;
    FXCODE:   load = ROM2, run = WRAMCODE, type = ro, define = yes, optional = yes;
}
