# ld65 config for a 32 KiB LoROM SNES cartridge.
# There is no SNES config shipped with cc65 2.18, so this is ours.
#
# LoROM file layout (32 KiB, one bank):
#   file $0000-$7FBF  ->  $00:8000-$00:FFBF   code/data
#   file $7FC0-$7FDF  ->  $00:FFC0-$00:FFDF   cartridge header
#   file $7FE0-$7FFF  ->  $00:FFE0-$00:FFFF   vectors
#
# WRAM: $00:0000-$00:1FFF is a mirror of $7E:0000-$7E:1FFF.
# SRAM: $70:0000-$70:7FFF (LoROM battery RAM) -- used as the result port.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0100, size = $1E00, type = rw;
    STACK:    start = $1F00, size = $0100, type = rw;

    ROM:      start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HEADER:   start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:     load = ROM,     type = ro,  start = $8000;
    RODATA:   load = ROM,     type = ro,  optional = yes;
    SNESHDR:  load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
    ZP:       load = ZEROPAGE, type = zp, optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes;
}
