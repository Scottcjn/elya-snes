# ld65 config for the 2 MiB LoROM cartridge that carries SIX topic shards.
#
# cc65 2.18 ships no SNES config, so this is ours, and it is rom/lorom1m.cfg
# grown from five shards to six.
#
# WHY 2 MiB AND NOT 1.  Six shards need 33 banks and 1 MiB is 32, so the sixth
# topic tips the cartridge over a power-of-two boundary by exactly one bank.
# The alternative was to pack MDATA, which is 89% padding by the note below --
# six shards' embeddings and positional tables are 64,512 bytes and would fit
# in two banks rather than six.  That was measured and rejected: it saves four
# banks of a resource this cartridge has 31 spare banks of, and it costs a
# lookup table in the hot path where `MDBANK + s` is three instructions.
#
# The spare banks are not waste either.  The FMV stream (tools/mkintro.py) is
# 23 banks bank-aligned, so 2 MiB holds the six shards AND the intro with eight
# banks left.  At 1 MiB neither would have fitted alongside the other.
#
# File layout (LoROM: bank N shows 32 KiB at $N0:8000-$N0:FFFF):
#   $000000-$007FBF   bank $00        driver, handlers, tables, router table
#   $007FC0-$007FDF   bank $00        cartridge header
#   $007FE0-$007FFF   bank $00        vectors
#   $008000-$0C7FFF   banks $01-$18   WEIGHTS: six weight programs, four banks
#                                     each, shard s at bank $01 + 4s
#   $0C8000-$0F7FFF   banks $19-$1E   MDATA:   shard s's embedding and
#                                     positional table, one bank each
#   $0F8000-$0FFFFF   bank  $1F       PTABSEG: the exact softmax normaliser's
#                                     division table
#   $100000-$107FFF   bank  $20       GAMEDATA: art, menu, router table, and
#                                     the questions the route survey runs
#   $108000-$1DFFFF   banks $21-$37   INTRODATA: the ESV1 intro stream, bank-
#                                     aligned by tools/mkintro.py so no frame
#                                     record straddles a 32 KiB bank
#   $1E0000-$1FFFFF   banks $38-$3F   padding to a power of two
#
# WHY THE EMBEDDING GETS A BANK PER SHARD RATHER THAN SHARING ONE.  Each shard
# is a whole model, so each has its own 64x64 embedding (8,192 bytes) and its
# own 20x64 positional table (2,560).  Three would fit in one bank and six
# would not, so the choice was one bank each or an uneven packing with a
# lookup.  `MDBANK + s` is three instructions where the packing is a table.
# The waste is deliberate and it is cheaper than the code.
#
# Nothing inside WEIGHTS, MDATA or PTAB is referenced by symbol: tools/emit.py
# placed every byte and rom/nn.s reaches them through constants in model.inc.
# Their memory-area `start` is therefore decorative, and deliberately so -- the
# blobs span banks, which no single ld65 address can describe.
#
# GAMEDATA is different: it IS referenced by symbol, so it gets a memory area
# of exactly one bank.  ld65 has no concept of a LoROM bank, so its labels come
# out as plain $8000-$FFFF addresses and the bank arrives as GDBASE, which the
# emitter writes into model.inc.  rom/game.inc no longer defines it: one
# definition site, chosen by whichever emitter laid the cartridge out.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    RAM:      start = $0700, size = $0100, type = rw;

    ROM0:     start = $8000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    HEADER:   start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    VECTORS:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $00;
    WBANKS:   start = $8000, size = $C0000, type = ro, file = %O, fill = yes, fillval = $00;
    MDBANKS:  start = $8000, size = $30000, type = ro, file = %O, fill = yes, fillval = $00;
    PBANK:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    GBANK:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    INTROBK:  start = $8000, size = $B8000, type = ro, file = %O, fill = yes, fillval = $00;
    PADBANK:  start = $8000, size = $40000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    CODE:     load = ROM0,    type = ro, start = $8000;
    RODATA:   load = ROM0,    type = ro, align = $100, optional = yes;
    SNESHDR:  load = HEADER,  type = ro;
    VECTORS:  load = VECTORS, type = ro;
    ZP:       load = ZEROPAGE, type = zp, optional = yes;
    BSS:      load = RAM,     type = bss, optional = yes;
    WEIGHTS:  load = WBANKS,  type = ro;
    MDATA:    load = MDBANKS, type = ro;
    PTABSEG:  load = PBANK,   type = ro;
    GAMEDATA: load = GBANK,   type = ro, optional = yes;
    INTRODATA: load = INTROBK, type = ro, optional = yes;
}
